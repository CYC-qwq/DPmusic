#AndroidCS: enforce UTF-8 & locale for Gradle daemon
#Fri Sep 18 17:00:16 GMT 2026
android.nonTransitiveRClass=true
org.gradle.daemon.idletimeout=10800000
kotlin.code.style=official
systemProp.user.language=en
systemProp.user.country=US
systemProp.sun.jnu.encoding=UTF-8
systemProp.file.encoding=UTF-8
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding\=UTF-8
android.useAndroidX=true

# 本机（AndroidIDE / aarch64 proot）环境适配：Android SDK 与 AGP 自带的是 x86-64 版 aapt2，
# 依赖 qemu 用户态模拟；该模拟在当前环境会 SIGILL（Illegal instruction）导致资源处理失败。
# 指向系统内的 aarch64 原生 aapt2 可绕过。若环境恢复正常或换用官方构建机，删除本行即可。
android.aapt2FromMavenOverride=/opt/android-aapt2/acs/bin/aapt2
